<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entrar | Plataforma de Cursos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f3ee;
      color: #2b2f38;
    }

    .box {
      width: 100%;
      max-width: 420px;
      margin: 20px;
      padding: 30px;
      background: white;
      border: 1px solid #d8d4c8;
      border-radius: 12px;
    }

    h1 {
      color: #1b2a4a;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8d4c8;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 25px;
      background: #c99a3b;
      color: #1b2a4a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .links {
      margin-top: 20px;
      text-align: center;
    }

    a {
      color: #1b2a4a;
      text-decoration: none;
    }

    #mensagem {
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
      min-height: 24px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Entrar</h1>

  <p>Entre na sua conta para acessar seus cursos.</p>

  <form id="form">

    <label for="email">E-mail</label>

    <input
      id="email"
      type="email"
      required
      autocomplete="email"
    >

    <label for="senha">Senha</label>

    <input
      id="senha"
      type="password"
      required
      autocomplete="current-password"
    >

    <button
      type="submit"
      id="botao"
    >
      Entrar
    </button>

  </form>

  <div id="mensagem"></div>

  <div class="links">

    <p>
      <a href="/esqueci-senha.html">
        Esqueci minha senha
      </a>
    </p>

    <p>
      Ainda não tem conta?
      <a href="/cadastro.html">
        Criar conta
      </a>
    </p>

    <p>
      <a href="/">
        ← Voltar para os cursos
      </a>
    </p>

  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://nydgcbmfvoszchuixaml.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_oToiwlSVBej_zb4ht0_Z3w_RHMDrwgK";

  const form =
    document.getElementById("form");

  const mensagem =
    document.getElementById("mensagem");

  const botao =
    document.getElementById("botao");


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      mensagem.textContent =
        "Entrando...";

      botao.disabled = true;

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const senha =
        document
          .getElementById("senha")
          .value;


      try {

        const resposta =
          await fetch(
            SUPABASE_URL +
            "/auth/v1/token?grant_type=password",
            {
              method: "POST",

              headers: {
                "apikey": SUPABASE_KEY,
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                email: email,
                password: senha
              })
            }
          );


        const resultado =
          await resposta.json();


        if (!resposta.ok) {

          throw new Error(
            resultado.msg ||
            resultado.error_description ||
            resultado.message ||
            "E-mail ou senha inválidos."
          );

        }


        /*
         * Salva a sessão no mesmo formato
         * utilizado pelo Supabase JS.
         */

        const projeto =
          "nydgcbmfvoszchuixaml";

        const chave =
          "sb-" +
          projeto +
          "-auth-token";


        const sessao = {

          access_token:
            resultado.access_token,

          refresh_token:
            resultado.refresh_token,

          expires_in:
            resultado.expires_in,

          expires_at:
            Math.floor(
              Date.now() / 1000
            ) +
            resultado.expires_in,

          token_type:
            resultado.token_type,

          user:
            resultado.user

        };


        localStorage.setItem(
          chave,
          JSON.stringify(sessao)
        );


        mensagem.textContent =
          "Login realizado! Redirecionando...";


        setTimeout(function() {

          window.location.href =
            "/dashboard.html";

        }, 500);


      } catch (erro) {

        console.error(erro);

        mensagem.textContent =
          erro.message ||
          "Não foi possível entrar.";

        botao.disabled = false;

      }

    }
  );

</script>

</body>
</html>
