<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso | Plataforma de Cursos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ee;
      color: #2b2f38;
    }

    header {
      background: #1b2a4a;
      padding: 18px 20px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 20px;
    }

    .curso {
      background: white;
      border-radius: 12px;
      padding: 30px;
      margin-top: 30px;
      border: 1px solid #d8d4c8;
    }

    h1 {
      color: #1b2a4a;
      margin-top: 0;
    }

    .trilha {
      color: #c99a3b;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 13px;
    }

    .descricao {
      color: #5b6474;
      line-height: 1.7;
      font-size: 17px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 24px;
      background: #c99a3b;
      color: #1b2a4a;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }

    #status {
      text-align: center;
      padding: 50px 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <a href="/">← Voltar para os cursos</a>
  </div>
</header>

<main class="container">

  <div id="status">
    Carregando curso...
  </div>

  <article class="curso" id="curso" style="display:none">

    <div class="trilha" id="trilha"></div>

    <h1 id="titulo"></h1>

    <p class="descricao" id="descricao"></p>

    <a href="/login.html" class="btn">
      Entrar para acessar
    </a>

  </article>

</main>

<script>
  const SUPABASE_URL =
    "https://nydgcbmfvoszchuixaml.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_oToiwlSVBej_zb4ht0_Z3w_RHMDrwgK";

  function escapeHtml(valor) {
    return String(valor || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async function carregarCurso() {

    const id =
      new URLSearchParams(window.location.search).get("id");

    const status =
      document.getElementById("status");

    if (!id) {
      status.textContent = "Curso não encontrado.";
      return;
    }

    try {

      const url =
        SUPABASE_URL +
        "/rest/v1/courses" +
        "?select=id,slug,title,description,trilha" +
        "&id=eq." +
        encodeURIComponent(id) +
        "&published=eq.true";

      const resposta = await fetch(url, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Accept": "application/json"
        }
      });

      const dados = await resposta.json();

      if (!resposta.ok) {
        throw new Error("Erro ao buscar curso");
      }

      if (!dados.length) {
        status.textContent = "Curso não encontrado.";
        return;
      }

      const curso = dados[0];

      document.getElementById("titulo").textContent =
        curso.title || "Curso";

      document.getElementById("trilha").textContent =
        curso.trilha || "Curso";

      document.getElementById("descricao").textContent =
        curso.description ||
        "Este curso está disponível na plataforma.";

      status.style.display = "none";

      document.getElementById("curso").style.display = "block";

      document.title =
        (curso.title || "Curso") +
        " | Plataforma de Cursos";

    } catch (erro) {

      console.error(erro);

      status.textContent =
        "Não foi possível carregar este curso.";
    }
  }

  carregarCurso();
</script>

</body>
</html>
